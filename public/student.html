window.CP_READY=(async()=>{
 try{
  const r=await fetch('/api/auth/me',{credentials:'same-origin'});
  if(!r.ok){location.replace('/login.html');return false}
  const {user}=await r.json();
  window.CP={user,session:{user:{id:user.id,email:user.email,user_metadata:{full_name:''}}},api:async(path,method='GET',body)=>{
   const res=await fetch('/api/'+path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
   const data=await res.json();if(!res.ok)throw new Error(data.error||'Request failed');return data;
  },sb:{auth:{signOut:async()=>fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'})}}};
  try{
   const [p,j,a,sv,rr]=await Promise.all([window.CP.api('profile'),window.CP.api('opportunities'),window.CP.api('applications'),window.CP.api('saved'),window.CP.api('resume')]);
   window.CP.profile=p.profile;window.CP.resume=rr.resume||null;window.CP.jobs=j.opportunities||[];window.CP.applications=a.applications||[];window.CP.saved=sv.saved||[];
  }catch(syncError){console.warn('Initial data sync:',syncError.message)}
  return true;
 }catch(e){location.replace('/login.html');return false}
})();
</script>

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function initials(n){return (n||'Student').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function profilePct(){let p=state.profile;let checks=[p.name,p.email,p.phone,p.college,p.degree,p.year,p.cgpa,p.target,p.about,state.profile.skills?.length>=4,state.resumeName];return Math.round(checks.filter(Boolean).length/checks.length*100)}

er</h2><p>Start with high-impact foundations</p></div></div><div class="timeline">${roadmap.map(item=>`<div class="timeline-item"><span class="timeline-dot"></span><div><strong>${item}</strong><p>Work through a focused exercise, then add evidence of the skill to your portfolio.</p></div></div>`).join('')}</div><p class="small muted">This is a starter roadmap. Learning links and personalised AI guidance are not connected in this demo.</p></aside></div>`}

function resume(){return `${demoRibbon()}${header('Resume analyser','Review your resume against a target role and improve clarity before applying.') }<div class="grid dashboard-grid"><section class="card section-card"><div class="section-title"><div><h2>Upload your resume</h2><p>PDF or DOCX · Maximum 4 MB</p></div></div><div class="resume-drop"><div style="font-size:2rem;color:var(--navy)">▤</div><strong style="color:var(--ink)">Choose your latest resume</strong><p class="small muted">Your resume is stored privately in Netlify Blobs and linked to your student account.</p><input id="resumeFile" type="file" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document"><div id="resumeFileName" class="small muted">${state.resumeName?`Stored resume: ${esc(state.resumeName)}`:'No resume uploaded yet'}</div></div><div class="field" style="margin-top:16px"><label for="resumeRole">Target role</label><select id="resumeRole"><option>Frontend Developer</option><option>Data Analyst</option><option>Backend Developer</option><option>Business Analyst</option></select></div><div class="action-row"><button class="btn btn-primary" id="uploadResume" type="button">Upload resume securely</button><button class="btn btn-outline" id="downloadResume" type="button">Download saved resume</button><button class="btn btn-outline" id="runResumeReview" type="button">Run sample checklist</button><button class="btn btn-outline" id="removeResume" type="button">Delete saved resume</button></div><div id="resumeResults" style="margin-top:17px"><div class="empty"><strong>Your resume checklist will appear here</strong><p>Your resume is stored privately. Upload a new version to replace it.</p></div></div></section><aside class="grid"><section class="card section-card"><h2>What a strong resume should show</h2><div class="timeline" style="margin-top:16px"><div class="timeline-item"><span class="timeline-dot"></span><div><strong>Role-relevant skills</strong><p>Use skills that are actually present in your projects or experience.</p></div></div><div class="timeline-item"><span class="timeline-dot"></span><div><strong>Evidence and outcomes</strong><p>Explain what you built, what you contributed and what changed.</p></div></div><div class="timeline-item"><span class="timeline-dot"></span><div><strong>Readable structure</strong><p>Keep headings, dates and formatting consistent.</p></div></div><div class="timeline-item"><span class="timeline-dot"></span><div><strong>Accurate information</strong><p>Never add keywords, experience or achievements you cannot support.</p></div></div></div></section><section class="card section-card"><h2>Important note</h2><p class="small muted" style="margin-top:8px">Any score shown here is a writing checklist—not an official ATS score, hiring decision or guarantee of selection.</p></section></aside></div>`}
function interviewprep(){let qs=[['Tell me about yourself.','Give a 60–90 second overview: education, relevant skills, one project and the role you want.'],['Describe a project you are proud of.','Use context, your responsibility, the technical choices you made and the result.'],['How do you handle a problem you cannot solve immediately?','Explain how you clarify the issue, break it down, research, test and communicate.'],['Why are you interested in this role?','Connect the company or role to your skills, interests and the work you want to learn.']];return `${demoRibbon()}${header('Interview preparation','Practise structured answers and build confidence before the interview.',`<button class="btn btn-outline" data-page="interviews">View interviews</button>`)}<div class="grid dashboard-grid"><section class="card section-card"><div class="section-title"><div><h2>Practice questions</h2><p>Write your answer and mark each question as practised</p></div><span class="pill gold">${state.prepDone.length}/${qs.length} completed</span></div>${qs.map((q,i)=>`<div class="question-card" style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><span class="eyebrow">Question ${i+1}</span><h3 style="margin-top:4px">${q[0]}</h3><p>${q[1]}</p></div><label class="checkline"><input type="checkbox" data-action="prep-check" data-id="${i}" ${state.prepDone.includes(i)?'checked':''}> Practised</label></div><textarea class="field-input" data-practice="${i}" placeholder="Draft your answer..." style="width:100%;margin-top:12px;min-height:76px;border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit;font-size:.83rem">${esc(state.practiceAnswers[i]||'')}</textarea></div>`).join('')}<button class="btn btn-primary" id="savePractice">Save practice notes</button></section><aside class="grid"><section class="card section-card"><h2>Use the STAR structure</h2><div class="timeline" style="margin-top:16px"><div class="timeline-item"><span class="timeline-dot"></span><div><strong>Situation</strong><p>Give the context in one or two sentences.</p></div></div><div class="timeline-item"><span class="timeline-dot"></span><div><strong>Task</strong><p>Explain what you were responsible for.</p></div></div><div class="timeline-item"><span class="timeline-dot"></span><div><strong>Action</strong><p>Focus on what you personally did and why.</p></div></div><div class="timeline-item"><span class="timeline-dot"></span><div><strong>Result</strong><p>Share the outcome and what you learned.</p></div></div></div></section><section class="card section-card"><h2>Before the interview</h2><p class="small muted" style="margin-top:7px">Review the job description, test your camera and audio, prepare questions for the interviewer and keep your resume nearby.</p></section></aside></div>`}
function interviews(){return `${demoRibbon()}${header('Interviews & alerts','Stay on top of interview schedules and important application updates.') }<div class="grid dashboard-grid"><section class="card section-card"><div class="section-title"><div><h2>Upcoming interviews</h2><p>Dates and details from your demo applications</p></div></div><div class="interview-box"><div class="interview-date"><div class="date-tile"><b>21</b><span>Nov 2026</span></div><div><strong style="color:var(--ink)">Technical interview · Junior Software Engineer</strong><p class="small muted">BluePebble Systems · 11:30 AM · Online</p></div></div><div class="action-row"><span class="pill gold">Google Meet · Sample link</span><button class="btn btn-outline btn-sm" data-page="interviewprep">Prepare →</button></div></div><div class="section-title" style="margin-top:23px"><div><h2>Application timeline</h2><p>Recent status changes</p></div></div><div class="timeline">${state.applications.map(a=>`<div class="timeline-item"><span class="timeline-dot"></span><div><strong>${esc(a.company)} · ${esc(a.status)}</strong><p>${esc(a.role)} — ${esc(a.updated)}</p></div></div>`).join('')}</div></section><section class="card section-card"><div class="section-title"><div><h2>Notification centre</h2><p>Application and product activity</p></div><button class="text-link" data-action="mark-all-read">Mark all read</button></div>${notificationRows()}</section></div>`}
function notificationRows(){let ns=[{id:'n1',ico:'✦',title:'You have been shortlisted',body:'PixelForge Studio moved your UI/UX Design Intern application to Shortlisted.',time:'Nov 15, 2026'},{id:'n2',ico:'◷',title:'Interview scheduled',body:'BluePebble Systems scheduled a technical interview for Nov 21 at 11:30 AM.',time:'Nov 14, 2026'},{id:'n3',ico:'▣',title:'Application received',body:'Northstar Labs received your application for Frontend Developer Intern.',time:'Nov 12, 2026'}];return ns.map(n=>`<div class="notification ${state.readNotifications.includes(n.id)?'':'unread'}"><div class="n-icon">${n.ico}</div><div style="flex:1"><strong>${n.title}</strong><p>${n.body}</p><time>${n.time}</time></div>${state.readNotifications.includes(n.id)?'':'<button class="text-link" data-action="read-notification" data-id="'+n.id+'">Mark read</button>'}</div>`).join('')}
function settings(){return `${demoRibbon()}${header('Settings & help','Manage your workspace preferences and understand how this demo works.') }<div class="grid dashboard-grid"><section class="card section-card"><div class="section-title"><div><h2>Preferences</h2><p>Your account data is connected to the CareerPilot backend.</p></div></div><div class="skill-row"><div><strong>Email notifications</strong><p>Receive application and interview reminders.</p></div><input type="checkbox" checked aria-label="Email notifications" disabled></div><div class="skill-row"><div><strong>Weekly career summary</strong><p>A weekly overview of saved roles and skill progress.</p></div><input type="checkbox" aria-label="Weekly summary" disabled></div><div class="skill-row"><div><strong>Privacy</strong><p>Use demo data only. Your profile and activity are stored in your secured account.</p></div><span class="pill green">Connected account</span></div><div class="action-row"><button class="btn btn-outline" data-action="reset-demo">Reset demo data</button><button class="btn btn-primary" data-action="logout">Exit student demo</button></div></section><aside class="grid"><section class="card section-card"><h2>Help centre</h2><div class="timeline" style="margin-top:16px"><div class="timeline-item"><span class="timeline-dot"></span><div><strong>How do recommendations work?</strong><p>They compare example student skills and preferences with example role requirements.</p></div></div><div class="timeline-item"><span class="timeline-dot"></span><div><strong>Are these real jobs?</strong><p>No. Only published opportunities in your connected database are shown.</p></div></div><div class="timeline-item"><span class="timeline-dot"></span><div><strong>Is my resume uploaded?</strong><p>No. Selecting a file only displays its name in this browser session.</p></div></div></div></section><section class="card section-card"><h2>Production readiness</h2><p class="small muted" style="margin-top:8px">Real student accounts require a backend authentication provider, server-side role checks, private file storage and a connected database. A Netlify static page by itself cannot securely provide those features.</p></section></aside></div>`}
const pages={dashboard,opportunities,saved,recommendations,skills,resume,interviewprep,applications,interviews,profile,settings};
let current='dashboard';
function render(page){if(!pages[page])page='dashboard';current=page;$('#pageContent').innerHTML=pages[page]();$$('.nav-link').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#navAppCount').textContent=state.applications.length;let av=initials(state.profile.name);$('#sideAvatar').textContent=av;$('#topAvatar').textContent=av;$('#sideName').textContent=state.profile.name;$('#topName').textContent=state.profile.name;$('#sidebar').classList.remove('open');$('#overlay').classList.remove('show');$('#menuToggle').setAttribute('aria-expanded','false');window.scrollTo(0,0);}
function openPage(p){render(p);if(location.hash!=='#'+p)history.replaceState(null,'','#'+p)}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-page]');if(nav){openPage(nav.dataset.page);return}let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;
if(a==='save-job'){(async()=>{try{if(state.saved.includes(id)){await window.CP.api('saved/'+id,'DELETE');state.saved=state.saved.filter(x=>x!==id);toast('Removed from saved opportunities.')}else{await window.CP.api('saved','POST',{opportunity_id:id});state.saved.push(id);toast('Opportunity saved to your account.')}persist();render(current)}catch(err){toast(err.message)}})()}
if(a==='apply-job'){let j=jobs.find(x=>x.id===id);if(j&&!state.applications.some(x=>x.jobId===id)){(async()=>{try{await window.CP.api('applications','POST',{opportunity_id:id});state.applications.unshift({id:'a'+Date.now(),jobId:id,role:j.role,company:j.company,date:new Date().toLocaleDateString(),status:'Applied',updated:'Application submitted to CareerPilot.'});persist();toast('Application submitted successfully.');render(current)}catch(err){toast(err.message)}})()}}
if(a==='cycle-skill'){let n=b.dataset.skill,cycle={have:'improve',improve:'learn',learn:'have'};state.skillStates[n]=cycle[state.skillStates[n]]||'have';persist();render(current)}
if(a==='read-notification'){if(!state.readNotifications.includes(id))state.readNotifications.push(id);persist();render(current)}
if(a==='mark-all-read'){state.readNotifications=['n1','n2','n3'];persist();render(current);toast('All demo notifications marked as read.')}
if(a==='reset-demo'){if(confirm('Reset all student demo changes in this browser?')){state=JSON.parse(JSON.stringify(seed));persist();render('dashboard');toast('Demo data reset.')}}
if(a==='logout'){window.CP.sb.auth.signOut().finally(()=>location.href='/login.html')}
if(a==='view-application'){let app=state.applications.find(x=>x.id===id);if(app)toast(app.company+': '+app.updated)}
});
document.addEventListener('submit',e=>{if(e.target.id==='profileForm'){e.preventDefault();let f=new FormData(e.target);state.profile={...state.profile,name:f.get('name').trim(),email:f.get('email').trim(),phone:f.get('phone').trim(),location:f.get('location').trim(),college:f.get('college').trim(),degree:f.get('degree').trim(),year:f.get('year'),cgpa:f.get('cgpa').trim(),target:f.get('target'),skills:String(f.get('skills')).split(',').map(x=>x.trim()).filter(Boolean),about:f.get('about').trim()};(async()=>{try{await window.CP.api('profile','PATCH',{full_name:state.profile.name,phone:state.profile.phone,location:state.profile.location,college:state.profile.college,degree:state.profile.degree,academic_year:state.profile.year,cgpa:state.profile.cgpa,target_role:state.profile.target,skills:state.profile.skills,about:state.profile.about});persist();render('profile');toast('Profile saved to your account.')}catch(err){toast(err.message)}})()}});
document.addEventListener('click',e=>{if(e.target.id==='menuToggle'||e.target.closest('#menuToggle')){let o=$('#sidebar').classList.toggle('open');$('#overlay').classList.toggle('show',o);$('#menuToggle').setAttribute('aria-expanded',String(o))}if(e.target.id==='overlay'){$('#sidebar').classList.remove('open');$('#overlay').classList.remove('show');$('#menuToggle').setAttribute('aria-expanded','false')}});
$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){openPage('opportunities');let f=$('#jobSearch');if(f){f.value=e.target.value;f.dispatchEvent(new Event('input'))}}});
document.addEventListener('input',e=>{if(e.target.id==='jobSearch'){let q=e.target.value.toLowerCase(),type=$('#typeFilter').value,work=$('#workFilter').value,sort=$('#sortFilter').value;let list=jobs.filter(j=>(!q||(j.role+' '+j.company+' '+j.skills.join(' ')).toLowerCase().includes(q))&&(!type||j.type===type)&&(!work||j.location.toLowerCase().includes(work.toLowerCase())));if(sort==='match')list.sort((a,b)=>b.match-a.match);else list.sort((a,b)=>new Date(a.deadline)-new Date(b.deadline));$('#jobsList').innerHTML=list.length?list.map(jobCard).join(''):'<div class="empty"><strong>No matching opportunities</strong><p>Try changing your search or filters.</p></div>';$('#jobResultCount').textContent=list.length+' opportunities'}});
document.addEventListener('change',e=>{if(e.target.id==='roleTarget'){state.profile.target=e.target.value;persist();render('skills')}if(['typeFilter','workFilter','sortFilter'].includes(e.target.id)){let inp=$('#jobSearch');inp.dispatchEvent(new Event('input'))}if(e.target.matches('[data-action="prep-check"]')){let id=Number(e.target.dataset.id);if(e.target.checked&&!state.prepDone.includes(id))state.prepDone.push(id);else state.prepDone=state.prepDone.filter(x=>x!==id);persist()}
if(e.target.id==='resumeFile'){let file=e.target.files[0];if(file){if(file.size>4*1024*1024){toast('Please choose a file smaller than 4 MB.');e.target.value='';return}$('#resumeFileName').textContent='Selected: '+file.name+' · Ready to upload';}}});
document.addEventListener('click',e=>{
if(e.target.id==='uploadResume'){
 const file=$('#resumeFile').files[0];if(!file){toast('Choose a PDF or DOCX resume first.');return}
 const ext=file.name.toLowerCase().split('.').pop();
 const mime=ext==='pdf'?'application/pdf':ext==='docx'?'application/vnd.openxmlformats-officedocument.wordprocessingml.document':'';
 if(!mime){toast('Only PDF and DOCX files are supported.');return}
 const btn=e.target;btn.disabled=true;btn.textContent='Uploading…';
 const reader=new FileReader();
 reader.onload=async()=>{try{const base64=String(reader.result).split(',')[1];const result=await window.CP.api('resume/upload','POST',{file_name:file.name,content_type:mime,file_base64:base64});window.CP.resume=result.resume;state.resumeName=result.resume.file_name;persist();$('#resumeFileName').textContent='Stored securely: '+result.resume.file_name;$('#resumeFile').value='';toast('Resume uploaded securely.')}catch(err){toast(err.message)}finally{btn.disabled=false;btn.textContent='Upload resume securely'}};
 reader.onerror=()=>{btn.disabled=false;btn.textContent='Upload resume securely';toast('Could not read this file.')};
 reader.readAsDataURL(file);
}
if(e.target.id==='downloadResume'){
 (async()=>{try{const r=await fetch('/api/resume/download',{credentials:'same-origin'});if(!r.ok){const d=await r.json();throw new Error(d.error||'Download failed')}const blob=await r.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=window.CP.resume?.file_name||'resume';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}catch(err){toast(err.message)}})();
}
if(e.target.id==='removeResume'){
 if(!window.CP.resume){toast('There is no saved resume to delete.');return}
 if(!confirm('Permanently delete your saved resume?'))return;
 (async()=>{try{await window.CP.api('resume','DELETE');window.CP.resume=null;state.resumeName='';persist();$('#resumeFileName').textContent='No resume uploaded yet';toast('Saved resume deleted permanently.')}catch(err){toast(err.message)}})();
}
if(e.target.id==='runResumeReview'){let file=$('#resumeFile').files[0];if(!file&&!state.resumeName){toast('Select a resume file first.');return}$('#resumeResults').innerHTML=`<div class="card" style="border:0;background:#F8FAFC;padding:15px"><div class="section-title"><div><h3>Sample resume checklist</h3><p>Illustrative guidance only; no document parsing has taken place.</p></div><span class="pill gold">Demo review</span></div>${[['Contact details','Check that your email and phone are current.'],['Project evidence','Describe two projects with your personal contribution and outcome.'],['Role keywords','Use relevant skills from the job description only where accurate.'],['Formatting','Keep section headings, dates and spacing consistent.']].map(x=>`<div class="skill-row"><div><strong>${x[0]}</strong><p>${x[1]}</p></div><span class="pill green">Review</span></div>`).join('')}</div>`;toast('Sample checklist generated. This is not an AI analysis.')}if(e.target.id==='savePractice'){ $$('[data-practice]').forEach(t=>state.practiceAnswers[t.dataset.practice]=t.value);persist();toast('Practice notes saved in this browser.')}});
document.addEventListener('click',e=>{let tab=e.target.closest('[data-filter]');if(tab){$$('#appTabs .tab').forEach(t=>t.classList.toggle('active',t===tab));let f=tab.dataset.filter,items=f==='All'?state.applications:state.applications.filter(a=>a.status===f);$('#applicationList').innerHTML=items.length?items.map(applicationRow).join(''):'<div class="empty"><strong>No applications in this stage</strong><p>Updates will appear here as your application progresses.</p></div>'}});
render(location.hash.replace('#','')||'dashboard');
})();
</script>
</body>
